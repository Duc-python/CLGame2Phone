name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  touchserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          set -e
          mkdir -p touchserver/out touchserver/dex
          javac -cp "$ANDROID_HOME/platforms/android-34/android.jar" -d touchserver/out touchserver/src/com/clgame2phone/TouchServer.java
          d8 --output touchserver/dex touchserver/out/com/clgame2phone/TouchServer.class
          cd touchserver/dex && zip -r ../touchserver.jar classes.dex
      - uses: actions/upload-artifact@v4
        with: { name: touchserver-jar, path: touchserver/touchserver.jar }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/gradle-build-action@v3
      - working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  agent:
    runs-on: windows-latest
    needs: touchserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/download-artifact@v4
        with: { name: touchserver-jar, path: touchserver }
      - run: dotnet publish pc/CLGame2Phone.Agent/CLGame2Phone.Agent.csproj -c Release -o out/agent
      - uses: actions/upload-artifact@v4
        with: { name: agent-build, path: out/agent }

  release:
    runs-on: ubuntu-latest
    needs: [touchserver, android, agent]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: touchserver-jar, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: agent-build, path: artifacts/agent }
      - name: Zip agent
        run: cd artifacts/agent && zip -r ../CLGame2Phone.Agent.zip . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/touchserver.jar
            artifacts/*.apk
            artifacts/CLGame2Phone.Agent.zip
          generate_release_notes: true